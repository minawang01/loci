# Fly.io deployment config. `app` must match the app created with `fly launch`.
# "loci" was already taken on Fly; the hostname is only cosmetic behind the
# custom domain.
app = "loci-notes"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  # Everything the app writes or schedules uses the host clock: note
  # timestamps, the date a todo list is named for, and PLAN_SEND_TIME. Fly
  # machines are UTC, which rolls the day over at 8pm the evening before.
  TZ = "America/New_York"
  # Non-secret half of the rclone config; the token goes in `fly secrets set`.
  RCLONE_CONFIG_DRIVE_TYPE = "drive"
  RCLONE_CONFIG_DRIVE_SCOPE = "drive.file"
  BACKUP_REMOTE = "drive:loci"
  BACKUP_INTERVAL_MINUTES = "15"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine up so Twilio never waits on a cold start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# notes.md and tags.json live here so they survive redeploys.
[[mounts]]
  source = "loci_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
