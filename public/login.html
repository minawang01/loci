<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>loci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<!-- Styles are inlined: /style.css sits behind the auth gate, and a login page
     that half-loads its own stylesheet looks broken. -->
<style>
  :root {
    --bg: #FAF9F9;
    --ink: oklch(0.08 0 0);
    --border: oklch(0.85 0 0);
    --muted: oklch(0.4 0 0);
    --serif: "Newsreader", Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    font-family: var(--serif);
    color: var(--ink);
  }

  .texture {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image: repeating-linear-gradient(
      45deg,
      transparent 0 6px,
      oklch(0.9 0.004 90) 6px 7px
    );
  }

  .login {
    position: relative;
    width: 100%;
    max-width: 320px;
  }

  .wordmark {
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
    margin: 0 0 40px;
  }

  label {
    display: block;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  input {
    width: 100%;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 15px;
    margin-bottom: 20px;
    outline: none;
  }
  input:focus { border-color: var(--ink); }

  button {
    width: 100%;
    font-family: var(--serif);
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--bg);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 3px;
    padding: 12px;
    cursor: pointer;
  }
  button:hover { opacity: 0.85; }

  .error {
    font-size: 13px;
    font-style: italic;
    color: oklch(0.5 0.16 25);
    margin: 16px 0 0;
    min-height: 18px;
  }

  .switch {
    width: auto;
    display: block;
    margin: 18px auto 0;
    padding: 0;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    background: none;
    border: none;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .switch:hover { color: var(--ink); opacity: 1; }

  .sent {
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .hint {
    font-size: 12.5px;
    font-style: italic;
    color: var(--muted);
    margin: -14px 0 20px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="texture" aria-hidden="true"></div>

  <main class="login">
    <div class="wordmark">loci</div>
    <p class="tagline">Everything you texted yourself.</p>

    <form id="loginForm" hidden>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Enter</button>
      <button type="button" class="switch" id="usePhone" hidden>Text me a code instead</button>
    </form>

    <form id="phoneForm" hidden>
      <div id="phoneStep">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(555) 123-4567" required />

        <div id="inviteField" hidden>
          <label for="invite">Invite code</label>
          <input id="invite" name="invite" type="text" autocapitalize="characters" autocomplete="off"
                 placeholder="ABCD-2345" />
          <p class="hint">Only needed the first time you sign up.</p>
        </div>

        <button type="submit" id="phoneSubmit">Text me a code</button>
      </div>

      <div id="codeStep" hidden>
        <p class="sent" id="sentTo"></p>
        <label for="code">Six-digit code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" pattern="[0-9]*" />
        <button type="button" id="codeSubmit">Enter</button>
      </div>

      <button type="button" class="switch" id="usePassword">Use a password instead</button>
    </form>

    <p class="error" id="error" role="alert"></p>
  </main>

  <script>
    const passwordForm = document.getElementById('loginForm');
    const phoneForm = document.getElementById('phoneForm');
    const phoneStep = document.getElementById('phoneStep');
    const codeStep = document.getElementById('codeStep');
    const phoneInput = document.getElementById('phone');
    const codeInput = document.getElementById('code');
    const codeSubmit = document.getElementById('codeSubmit');
    const sentTo = document.getElementById('sentTo');
    const error = document.getElementById('error');
    const inviteInput = document.getElementById('invite');

    // An invite link carries the code, so the person only types their number.
    inviteInput.value = new URLSearchParams(location.search).get('invite') || '';

    function post(url, payload) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    function show(which) {
      error.textContent = '';
      const phone = which === 'phone';
      phoneForm.hidden = !phone;
      passwordForm.hidden = phone;
      (phone ? phoneInput : document.getElementById('username')).focus();
    }

    // Phone sign-in only exists where Twilio Verify is configured; without it the
    // page stays exactly as it was.
    fetch('/login/options')
      .then(res => res.json())
      .then(options => {
        document.getElementById('usePhone').hidden = !options.otp;
        document.getElementById('inviteField').hidden = !options.invites;
        show(options.otp ? 'phone' : 'password');
      })
      .catch(() => show('password'));

    document.getElementById('usePhone').addEventListener('click', () => show('phone'));
    document.getElementById('usePassword').addEventListener('click', () => show('password'));

    passwordForm.addEventListener('submit', async event => {
      event.preventDefault();
      error.textContent = '';
      const res = await post('/login', {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      });

      if (res.ok) return window.location.replace('/');

      const body = await res.json().catch(() => ({}));
      error.textContent = body.error || 'Could not sign you in.';
      document.getElementById('password').value = '';
    });

    phoneForm.addEventListener('submit', async event => {
      event.preventDefault();
      error.textContent = '';
      const button = document.getElementById('phoneSubmit');
      button.disabled = true;
      const res = await post('/login/otp/start', {
        phone: phoneInput.value,
        invite: inviteInput.value
      });
      button.disabled = false;

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        error.textContent = body.error || 'Could not send a code.';
        return;
      }

      // The server answers the same way for numbers it does not recognise, so
      // the copy here can't promise the text actually went out.
      sentTo.textContent = `If ${phoneInput.value} can sign in, a code is on its way.`;
      phoneStep.hidden = true;
      codeStep.hidden = false;
      codeInput.focus();
    });

    codeSubmit.addEventListener('click', async () => {
      error.textContent = '';
      codeSubmit.disabled = true;
      const res = await post('/login/otp/check', {
        phone: phoneInput.value,
        code: codeInput.value,
        invite: inviteInput.value
      });
      codeSubmit.disabled = false;

      if (res.ok) {
        // A number that just signed up has nowhere to keep notes yet, so it goes
        // to onboarding instead of a dashboard that would have nothing to show.
        const body = await res.json().catch(() => ({}));
        return window.location.replace(body.onboarding ? '/onboarding' : '/');
      }

      const body = await res.json().catch(() => ({}));
      error.textContent = body.error || 'Could not sign you in.';
      codeInput.value = '';
      codeInput.focus();
    });

    codeInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        codeSubmit.click();
      }
    });
  </script>
</body>
</html>
