<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>loci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="texture" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="wordmark">loci</div>
      <button class="logout" id="logout" type="button">Sign out</button>
    </header>

    <div class="layout" id="layout">
      <section class="feed" id="feed">
        <div class="tabs" id="tabs">
          <button type="button" class="tab active" data-view="notes">Notes</button>
          <button type="button" class="tab" data-view="goals">Goals</button>
        </div>

        <div class="search">
          <span class="search-glyph" aria-hidden="true">⌕</span>
          <input id="search" type="text" placeholder="Search by word, date, or theme..." autocomplete="off" />
        </div>

        <div class="tag-filter" id="tagFilter"></div>

        <div class="board" id="board"></div>

        <div class="empty-state" id="emptyState" hidden>
          <p>Nothing here yet.</p>
          <p class="empty-sub">Text your loci number, or write one below.</p>
        </div>

        <div class="board" id="goalBoard" hidden></div>

        <div class="empty-state" id="goalEmpty" hidden>
          <p>No goals yet.</p>
          <p class="empty-sub">Text <span>#goals</span> followed by what you want to achieve.</p>
        </div>
      </section>

      <aside class="today" id="today">
        <div class="today-head">
          <span class="today-label">Today</span>
          <span class="today-date" id="todayDate"></span>
        </div>
        <div class="today-items" id="todayItems"></div>
        <p class="today-empty" id="todayEmpty">Nothing yet. Text <span>#todo</span> to add.</p>

        <div class="busy" id="busy" hidden>
          <span class="busy-label">Busy</span>
          <div class="busy-blocks" id="busyBlocks"></div>
        </div>

        <div class="plan">
          <button class="plan-button" id="planButton" type="button">Plan tomorrow</button>
          <div class="plan-result" id="planResult" hidden></div>
        </div>
      </aside>
    </div>

    <section class="detail" id="detail" hidden>
      <div class="detail-bar">
        <button class="back" id="back" type="button"><span>←</span><span>Back to the feed</span></button>
        <button class="detail-delete" id="detailDelete" type="button">Delete</button>
      </div>
      <div class="detail-meta" id="detailMeta"></div>
      <p class="detail-title" id="detailTitle"></p>
      <div class="detail-items" id="detailItems"></div>
      <div class="detail-tags" id="detailTags"></div>
    </section>
  </div>

  <form class="composer" id="composer">
    <input id="composerInput" type="text" placeholder="Write a note… #todo for today's list, #done to cross one off, #busy 9am-5pm work, #goals for a goal" autocomplete="off" />
    <button type="submit">Save</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
