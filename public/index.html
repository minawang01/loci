<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>loci — notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="wordmark">lo<span>ci</span></div>
      <div class="topbar-tools">
        <input id="search" class="search-input" type="text" placeholder="search notes, tags…" />
        <div class="tag-filter" id="tagFilter"></div>
      </div>
    </header>

    <main class="board" id="board">
      <!-- note cards injected here -->
    </main>

    <div class="empty-state" id="emptyState" hidden>
      <p>No notes yet.</p>
      <p class="empty-sub">Text your loci number, or write one below.</p>
    </div>
  </div>

  <form class="composer" id="composer">
    <span class="composer-caret">&gt;</span>
    <input id="composerInput" type="text" placeholder="type a note… use #tag to file it under a tag" autocomplete="off" />
    <button type="submit">send</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
